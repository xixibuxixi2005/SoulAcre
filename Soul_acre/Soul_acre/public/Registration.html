<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Homestead</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:'#4F46E5',secondary:'#10B981'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :where([class^="ri-"])::before { content: "\f3c2"; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9fafb;
            background-image: url('picture/user_registration.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .card {
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.00);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .input-field {
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        .invite-code-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease, margin 0.5s ease;
            opacity: 0;
        }
        .invite-code-section.active {
            max-height: 200px;
            opacity: 1;
            margin-top: 1.5rem;
        }
        body.transitioning {
            animation: fadeOut 0.5s ease-in-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        /* 添加 fadeIn 动画关键帧，与 login.html 保持一致 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 为卡片添加动画类 */
        .card {
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.00);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.8s ease-out; /* 应用动画 */
        }
        #errorMessage {
            color: red;
            margin-top: 10px;
        }
        #successMessage {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
<div class="card w-full max-w-md p-8 rounded-xl">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">欢迎来到自留地</h1>
        <h2 class="text-lg text-gray-600">用户注册</h2>
    </div>

    <form id="registrationForm" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none w-10 h-10">
                    <i class="ri-user-line text-gray-400"></i>
                </div>
                <input type="text" id="username" name="username" class="input-field w-full pl-10 pr-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-0 focus:border-primary" placeholder="请输入您的用户名" required>
            </div>
            <p class="mt-1 text-xs text-gray-500">用户名长度需在 4-20 个字符之间</p>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none w-10 h-10">
                    <i class="ri-lock-line text-gray-400"></i>
                </div>
                <input type="password" id="password" name="password" class="input-field w-full pl-10 pr-10 py-2 border border-gray-300 rounded focus:outline-none focus:ring-0 focus:border-primary" placeholder="请输入您的密码" required>
                <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center w-10 h-10">
                    <i class="ri-eye-off-line text-gray-400"></i>
                </button>
            </div>
            <div class="mt-1 flex items-center space-x-1">
                <div class="h-1 w-1/4 rounded-full bg-gray-200" id="strength-1"></div>
                <div class="h-1 w-1/4 rounded-full bg-gray-200" id="strength-2"></div>
                <div class="h-1 w-1/4 rounded-full bg-gray-200" id="strength-3"></div>
                <div class="h-1 w-1/4 rounded-full bg-gray-200" id="strength-4"></div>
            </div>
            <p class="mt-1 text-xs text-gray-500">密码至少包含 8 个字符，建议使用字母、数字和特殊符号</p>
        </div>

        <div>
            <button type="button" id="requestInviteBtn" class="w-full bg-primary text-white py-2 px-4 rounded-button hover:bg-opacity-90 transition-all whitespace-nowrap">
                申请邀请码
            </button>
        </div>

        <div id="inviteCodeSection" class="invite-code-section">
            <div>
                <label for="inviteCode" class="block text-sm font-medium text-gray-700 mb-1">邀请码</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none w-10 h-10">
                        <i class="ri-key-line text-gray-400"></i>
                    </div>
                    <input type="text" id="inviteCode" name="inviteCode" class="input-field w-full pl-10 pr-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-0 focus:border-primary" placeholder="请输入邀请码" required>
                </div>
            </div>

            <div class="mt-4">
                <button type="button" id="confirmRegistrationBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-button hover:bg-opacity-90 transition-all whitespace-nowrap">
                    确认注册
                </button>
            </div>
        </div>
    </form>
    <div id="errorMessage"></div>
    <div id="successMessage"></div>

    <div class="mt-6 text-center text-sm">
        <p class="text-gray-600">已有账号？<a href="Login.html" class="text-primary hover:underline" id="loginLink">立即登录</a></p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const requestInviteBtn = document.getElementById('requestInviteBtn');
        const inviteCodeSection = document.getElementById('inviteCodeSection');
        const confirmRegistrationBtn = document.getElementById('confirmRegistrationBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const strengthBars = [
            document.getElementById('strength-1'),
            document.getElementById('strength-2'),
            document.getElementById('strength-3'),
            document.getElementById('strength-4')
        ];

        // 切换密码可见性
        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // 切换图标
            const iconClass = type === 'password' ? 'ri-eye-off-line' : 'ri-eye-line';
            togglePasswordBtn.innerHTML = `<i class="${iconClass} text-gray-400"></i>`;
        });

        // 显示邀请码区域
        requestInviteBtn.addEventListener('click', async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 验证用户名和密码是否为空
            if (!username || !password) {
                errorMessage.textContent = '用户名和密码不能为空';
                successMessage.textContent = '';
                return;
            }

            // 验证用户名和密码是否符合要求
            if (username.length < 4 || username.length > 20) {
                errorMessage.textContent = '用户名长度需在 4 - 20 个字符之间';
                successMessage.textContent = '';
                return;
            }

            if (password.length < 8|| password.length > 20) {
                errorMessage.textContent = '密码至少包含 8 个字符,在20个字符以下';
                successMessage.textContent = '';
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/generateInvitationCode', {
                    method: 'POST',
                    headers: {
                        // 添加身份验证头
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (response.ok) {
                    errorMessage.textContent = '';
                    successMessage.textContent = '请输入邀请码完成注册（联系开发者获取邀请码）';
                    inviteCodeSection.classList.add('active');

                    // 改变按钮状态
                    requestInviteBtn.textContent = '邀请码已发送';
                    requestInviteBtn.classList.remove('bg-primary');
                    requestInviteBtn.classList.add('bg-gray-500');
                    requestInviteBtn.disabled = true;

                    // 聚焦到邀请码输入框
                    setTimeout(() => {
                        document.getElementById('inviteCode').focus();
                    }, 500);
                } else {
                    const data = await response.json();
                    errorMessage.textContent = data.error || '生成邀请码失败，请稍后重试';
                    successMessage.textContent = '';
                }
            } catch (error) {
                errorMessage.textContent = error.message || error;
                successMessage.textContent = '';
            }
        });

        // 密码强度检测
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d+/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            // 更新强度条
            strengthBars.forEach((bar, index) => {
                if (index < strength) {
                    bar.classList.remove('bg-gray-200');

                    if (strength === 1) bar.classList.add('bg-red-500');
                    else if (strength === 2) bar.classList.add('bg-orange-500');
                    else if (strength === 3) bar.classList.add('bg-yellow-500');
                    else bar.classList.add('bg-green-500');
                } else {
                    bar.className = 'h-1 w-1/4 rounded-full bg-gray-200';
                }
            });
        });

        // 完成注册
        confirmRegistrationBtn.addEventListener('click', async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const invitationCode = document.getElementById('inviteCode').value;

            // 验证邀请码是否为空
            if (!invitationCode) {
                errorMessage.textContent = '邀请码不能为空';
                successMessage.textContent = '';
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        invitationCode: invitationCode
                    })
                });

                // 修改注册成功跳转部分
                if (response.ok) {
                    const data = await response.json();
                    errorMessage.textContent = '';
                    successMessage.textContent = data.success;

                    // 显示提示信息并 3 秒后跳转
                    const jumpMessage = document.createElement('p');
                    jumpMessage.textContent = '3 秒后将跳转。';
                    successMessage.appendChild(jumpMessage);

                    document.body.classList.add('transitioning');
                    setTimeout(() => {
                        window.location.href = 'Home.html';
                    }, 1000);
                }else {
                    const data = await response.json();
                    errorMessage.textContent = data.error || '注册失败，请稍后重试';
                    successMessage.textContent = '';
                }
            } catch (error) {
                errorMessage.textContent = error.response?.data?.error || '注册失败，请稍后重试';
                successMessage.textContent = '';
            }
        });

        // 为登录链接添加点击事件监听器
        document.getElementById('loginLink').addEventListener('click', function (e) {
            e.preventDefault();
            document.body.classList.add('transitioning');
            setTimeout(() => {
                window.location.href = this.href;
            }, 500);
        });
    });
</script>
</body>
</html>
