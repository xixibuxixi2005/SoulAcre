<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <title>用户注册</title>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
<div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center">用户注册</h2>
    <form id="registrationForm">
        <div class="mb-4">
            <label for="username" class="block text-gray-700 text-sm font-bold mb-2">用户名</label>
            <input type="text" id="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="请输入用户名">
        </div>
        <div class="mb-4">
            <label for="password" class="block text-gray-700 text-sm font-bold mb-2">密码</label>
            <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="请输入密码">
        </div>
        <div class="mb-6">
            <label for="invitationCode" class="block text-gray-700 text-sm font-bold mb-2">邀请码</label>
            <input type="text" id="invitationCode" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="请输入邀请码">
        </div>
        <div class="flex items-center justify-between">
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">注册</button>
        </div>
    </form>
    <div id="message" class="mt-4 text-center"></div>
</div>
<script>
    const registrationForm = document.getElementById('registrationForm');
    registrationForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const invitationCode = document.getElementById('invitationCode').value;
        try {
            const response = await fetch('http://localhost:8080/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username,
                    password,
                    invitationCode
                })
            });
            const data = await response.json();
            const messageDiv = document.getElementById('message');
            if (response.ok) {
                messageDiv.textContent = data.success;
                messageDiv.classList.add('text-green-500');
                messageDiv.classList.remove('text-red-500');
            } else {
                messageDiv.textContent = data.error;
                messageDiv.classList.add('text-red-500');
                messageDiv.classList.remove('text-green-500');
            }
        } catch (error) {
            console.error('请求出错:', error);
        }
    });
</script>
</body>
</html>
