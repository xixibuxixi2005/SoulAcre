<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', secondary: '#a855f7' }, borderRadius: { 'none': '0px', 'sm': '4px', DEFAULT: '8px', 'md': '12px', 'lg': '16px', 'xl': '20px', '2xl': '24px', '3xl': '32px', 'full': '9999px', 'button': '8px' } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :where([class^="ri-"])::before {
            content: "\f3c2";
        }

        body {
            min-height: 100vh;

            background-image: url('picture/sky.jpg');
            background-size: cover;
            /* 覆盖整个视口 */
            background-position: center center;
            /* 居中显示 */
            background-repeat: no-repeat;
            /* 禁止重复 */
            background-attachment: fixed;
            /* 背景固定不随滚动条移动 */
            overflow: hidden;
        }

        .meteor {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0;
            top: 0;
            right: 0;
            transform: rotate(45deg);
            animation: meteor 3s linear infinite;
            border-radius: 100px;
        }

        .meteor::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0) 100%);
            transform-origin: top center;
            transform: translateY(-100%);
        }

        .meteor::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 100%);
            box-shadow: 0 0 20px 8px rgba(255, 255, 255, 0.6);
        }

        @keyframes meteor {
            0% {
                transform: translateX(0) translateY(0) rotate(45deg);
                opacity: 1;
            }

            10% {
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform: translateX(-100vw) translateY(100vh) rotate(45deg);
                opacity: 0;
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
        }



        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .input-field:focus {
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .login-button {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s;
        }

        .login-button:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }

        .custom-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            display: inline-block;
            position: relative;
        }

        .custom-checkbox:checked {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-color: transparent;
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 3px;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .login-container {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 修改文字动画效果 */
        @keyframes poeticAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -40%) scale(0.8);
                filter: blur(10px);
            }

            40% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
                filter: blur(0px);
            }

            60% {
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0.2;
                transform: translate(-50%, -60%) scale(0.9);
                filter: blur(4px);
            }
        }

        .text-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            font-family: 'Pacifico', cursive;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            background: linear-gradient(45deg, #fff8e5 30%, #ffe55c 70%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: poeticAppear 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* 添加粒子效果 */
        .text-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 230, 92, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 1.5s ease-out forwards;
        }

        @keyframes particleFloat {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        /* 新增文字样式 */
        .text-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: white;
            opacity: 0;
            animation: textFadeIn 3s ease-in-out forwards;
        }

        body.transitioning {
            animation: fadeOut 0.5s ease-in-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        #errorMessage {
            color: red;
            margin-top: 10px;
        }

        #successMessage {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>

<body class="font-sans text-white flex items-center justify-center p-4">
<div id="meteor-container"></div>
<div class="login-container glass-effect rounded-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold mb-2">欢迎进入自留地</h1>
        <p class="text-xl text-gray-300">用户登录</p>
    </div>
    <form id="loginForm" class="space-y-6">
        <div class="space-y-2">
            <label for="username" class="block text-sm font-medium text-gray-300">用户名</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none w-10 h-10">
                    <i class="ri-user-line text-gray-400"></i>
                </div>
                <input type="text" id="username"
                       class="input-field w-full py-3 pl-10 pr-3 text-white border-none rounded focus:outline-none"
                       placeholder="请输入您的用户名" required>
            </div>
        </div>
        <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-300">密码</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none w-10 h-10">
                    <i class="ri-lock-line text-gray-400"></i>
                </div>
                <input type="password" id="password"
                       class="input-field w-full py-3 pl-10 pr-3 text-white border-none rounded focus:outline-none"
                       placeholder="请输入您的密码" required>
            </div>
        </div>
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="custom-checkbox">
                <label for="remember" class="ml-2 text-sm text-gray-300 cursor-pointer">记住密码</label>
            </div>
            <a href="#" class="text-sm text-primary hover:text-secondary transition-colors">忘记密码？</a>
        </div>
        <button type="submit"
                class="login-button w-full py-3 text-white font-medium !rounded-button whitespace-nowrap">登 录</button>
        <div class="text-center text-sm text-gray-400">
            还没有账号？<a href="Registration.html" class="text-primary hover:text-secondary transition-colors">立即注册</a>
        </div>
    </form>
    <div id="errorMessage"></div>
    <div id="successMessage"></div>
</div>
<script>
    // 创建流星效果
    function createMeteors() {
        const container = document.getElementById('meteor-container');
        const maxMeteors = 5;
        function createMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            // 随机位置
            const startPositionX = Math.random() * window.innerWidth * 0.8;
            const startPositionY = Math.random() * window.innerHeight * 0.2;
            // 随机大小
            const size = Math.random() * 2 + 1;
            // 随机动画延迟和持续时间
            const delay = Math.random() * 5;
            const duration = Math.random() * 3 + 2;
            meteor.style.right = `${startPositionX}px`;
            meteor.style.top = `${startPositionY}px`;
            meteor.style.width = `${size}px`;
            meteor.style.height = `${size}px`;
            meteor.style.animationDelay = `${delay}s`;
            meteor.style.animationDuration = `${duration}s`;
            container.appendChild(meteor);

            // 修改后的显示文字函数
            function showText() {
                // 创建文字元素
                const textElement = document.createElement('div');
                textElement.className = 'text-display';
                textElement.textContent = '偷得浮生半日闲';

                // 创建粒子效果
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'text-particle';
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.animationDelay = `${i * 0.05}s`;
                    textElement.appendChild(particle);
                }

                document.body.appendChild(textElement);
            }

            setTimeout(showText, delay * 1000);
        }

        for (let i = 0; i < maxMeteors; i++) {
            setTimeout(createMeteor, i * 1000);
        }
    }

    createMeteors();

    // 表单提交事件
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // 调试信息，确认元素是否正确获取
        console.log('loginForm:', loginForm);
        console.log('errorMessage:', errorMessage);
        console.log('successMessage:', successMessage);

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:8080/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Response data:', data);
                    errorMessage.textContent = '';
                    successMessage.textContent = data.success;

                    // 显示提示信息并 3 秒后跳转
                    // const jumpMessage = document.createElement('p');
                    // jumpMessage.textContent = '3 秒后将跳转。';
                    // successMessage.appendChild(jumpMessage);

                    document.body.classList.add('transitioning');
                    setTimeout(() => {
                        window.location.href = 'Home.html';
                    }, 1000);
                } else {
                    const data = await response.json();
                    console.log('Error response data:', data);
                    errorMessage.textContent = data.error;
                    successMessage.textContent = '';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = '网络错误，请稍后重试。';
                successMessage.textContent = '';
            }
        });
    });

    // 为注册链接添加点击事件监听器
    document.querySelector('a[href="Registration.html"]').addEventListener('click', function (e) {
        e.preventDefault();
        document.body.classList.add('transitioning');
        setTimeout(() => {
            window.location.href = this.href;
        }, 500);
    });
</script>
</body>

</html>
